      <button class="btn btn-ghost" onclick="renderQuizHome()">← Níveis</button>
    </div>
  </div></div>`;
}

async function saveSubscriptionAdmin(id){const res=await authFetch(`/api/admin/users/${id}/subscription`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({plan:document.getElementById('admin-plan').value,status:document.getElementById('admin-status').value,days:Number(document.getElementById('admin-days').value)})});const data=await res.json();if(!res.ok)return toast(data.error,'err');toast('Assinatura atualizada.','ok');closeAdminModal();renderAdmin();}
async function sendPasswordReset(id,email){if(!confirm(`Enviar redefinição de senha para ${email}?`))return;const res=await authFetch(`/api/admin/users/${id}/password-reset`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})});const data=await res.json();toast(res.ok?'E-mail de redefinição enviado.':data.error,res.ok?'ok':'err');}
async function removeFromRanking(id){if(!confirm('Remover este usuário do ranking e zerar pontos/progresso?'))return;const res=await authFetch(`/api/admin/users/${id}/ranking`,{method:'DELETE'});const data=await res.json();toast(res.ok?'Usuário removido do ranking.':data.error,res.ok?'ok':'err');if(res.ok)renderAdmin();}
async function deleteAdminUser(id,email){if(!confirm(`EXCLUIR permanentemente a conta ${email}? Esta ação não pode ser desfeita.`))return;const typed=prompt('Digite EXCLUIR para confirmar:');if(typed!=='EXCLUIR')return;const res=await authFetch(`/api/admin/users/${id}`,{method:'DELETE'});const data=await res.json();toast(res.ok?'Conta excluída permanentemente.':data.error,res.ok?'ok':'err');if(res.ok)renderAdmin();}

// ─── TOAST ───
function toast(msg,type){
  const t=document.getElementById('toast');
  t.textContent=msg; t.className=`toast ${type||''} show`;
  setTimeout(()=>t.classList.remove('show'),3000);
}
</script>
<script>
let paymentConfig = null;
let supabaseClient = null;
let currentSession = null;
let subscriptionActive = false;
let progressSyncTimer = null;

function queueProgressSync(){
  if(!currentSession?.access_token||!me)return;
  clearTimeout(progressSyncTimer);
  progressSyncTimer=setTimeout(async()=>{
    try{await authFetch('/api/my-progress',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({score:DB.scores[me]||0,progress:DB.progress[me]||{}})});}catch(err){console.warn('Progresso será sincronizado depois.');}
  },900);
}

async function loadCloudProgress(){
  try{const res=await authFetch('/api/my-progress');if(!res.ok)return;const cloud=await res.json();DB.scores[me]=Math.max(DB.scores[me]||0,Number(cloud.score||0));const local=DB.progress[me]||{};for(const [level,value] of Object.entries(cloud.progress||{}))local[level]=Math.max(Number(local[level]||0),Number(value||0));DB.progress[me]=local;localStorage.setItem('el2_db',JSON.stringify(DB));queueProgressSync();}catch(err){console.warn('Progresso local em uso.');}
}

(async function initPayments(){
  try {
    paymentConfig = await fetch('/api/config').then(r => r.json());
    if (!paymentConfig.supabaseUrl) throw new Error(paymentConfig.error || 'Configuração indisponível');
    supabaseClient = window.supabase.createClient(paymentConfig.supabaseUrl, paymentConfig.supabaseAnonKey);
    const { data } = await supabaseClient.auth.getSession();
    currentSession = data.session;
    if (currentSession) await enterAuthenticatedApp(currentSession.user);
  } catch (err) {
    console.error(err);
    document.getElementById('lerr').textContent = 'Sistema de acesso temporariamente indisponível.';
  }
})();

async function doLogin(){
  const email = document.getElementById('le').value.trim();
  const password = document.getElementById('lp').value;
  const err = document.getElementById('lerr');
  err.style.display = 'none';
  const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
  if (error) {
    err.textContent = 'E-mail ou senha incorretos.';
    err.style.display = 'block';
    return;
  }
  currentSession = data.session;
  await enterAuthenticatedApp(data.user);
}

async function doRegister(){
  const name = document.getElementById('rn').value.trim();
  const email = document.getElementById('re').value.trim();
  const password = document.getElementById('rp').value;
  const err = document.getElementById('rerr');
  if (!name || !email || password.length < 6) {
    err.textContent = 'Preencha todos os campos corretamente.';
    err.style.display = 'block';
    return;
  }
  const { data, error } = await supabaseClient.auth.signUp({
    email, password, options: { data: { name } }
  });
  if (error) {
    err.textContent = error.message.includes('registered') ? 'E-mail já cadastrado.' : 'Não foi possível criar a conta.';
    err.style.display = 'block';
    return;
  }
  err.style.display = 'none';
  if (!data.session) {
    err.textContent = 'Cadastro criado. Confirme o e-mail e depois entre.';
    err.style.color = 'var(--green)';
    err.style.display = 'block';
    return;
  }
  currentSession = data.session;
  await enterAuthenticatedApp(data.user);
}

function demoLogin(){
  toast('O acesso de convidado foi removido. Crie uma conta e assine um plano.', 'err');
}

async function enterAuthenticatedApp(user){
  const email = user.email;
  const name = user.user_metadata?.name || email.split('@')[0];
  me = email;
  if (!DB.users[email]) DB.users[email] = { n: name };
  DB.users[email].n = name;
  if (!DB.progress[email]) DB.progress[email] = {};
  if (DB.scores[email] === undefined) DB.scores[email] = 0;
  save();

  document.getElementById('tav').textContent = name[0].toUpperCase();
  document.getElementById('tname').textContent = name;
  document.getElementById('auth-screen').classList.remove('active');
  document.getElementById('app-screen').classList.add('active');
  document.getElementById('n-admin').style.display = email.toLowerCase()==='gustavodivino886@gmail.com' ? '' : 'none';
  await refreshSubscription();
  if(subscriptionActive)await loadCloudProgress();
}

async function authFetch(url, options = {}){
  const token = currentSession?.access_token;
  return fetch(url, {
    ...options,
    headers: { ...(options.headers || {}), Authorization: `Bearer ${token}` }
  });
}

async function refreshSubscription(){
  const res = await authFetch('/api/subscription-status');
  if (res.status === 401) return doLogout();
  const status = await res.json();
  subscriptionActive = Boolean(status.active);
  updateSubscriptionBubble(status);
  if (subscriptionActive) {
    document.querySelector('.main-nav').style.display = '';
    go('dashboard');
  } else {
    document.querySelector('.main-nav').style.display = 'none';
    renderPaywall(status);
  }
}

function updateSubscriptionBubble(status = {}){
  const bubble = document.getElementById('subscription-bubble');
  if (!bubble) return;
  if (!status.active || !status.accessUntil) {
    bubble.classList.remove('show');
    return;
  }
  const expiration = new Date(status.accessUntil);
  const remainingMs = Math.max(0, expiration.getTime() - Date.now());
  const days = Math.max(1, Math.ceil(remainingMs / 86400000));
  const planName = status.plan === 'weekly' ? 'Semanal' : 'Mensal';
  document.getElementById('sub-plan').textContent = planName;
  document.getElementById('sub-days').textContent = days === 1 ? '1 dia restante' : `${days} dias restantes`;
  bubble.title = `Plano ${planName} ativo até ${expiration.toLocaleString('pt-BR')}`;
  bubble.setAttribute('aria-label', bubble.title);
  bubble.classList.add('show');
}

function renderPaywall(status = {}){
  const weekly = paymentConfig.plans.weekly;
  const monthly = paymentConfig.plans.monthly;
  document.getElementById('mc').innerHTML = `
    <div class="pay-hero" style="max-width:880px;margin:1.5rem auto;text-align:center">
      <div class="bolt">🔒</div>
      <span class="chip on">FORMAÇÃO COMPLETA EM ELETROTÉCNICA</span><h2 style="font-size:2rem;margin:.8rem 0">Aprenda do básico ao profissional</h2>
      <p style="color:var(--text2);margin:0 auto 1.5rem;max-width:620px">50 níveis, PDFs, videoaulas, quizzes corrigidos por IA, Tutor ElectroLearn e notícias do Mundo Elétrico. Acesso liberado após a confirmação real do Asaas.</p>
      ${new URLSearchParams(location.search).get('payment') === 'success'
        ? '<div class="hl" style="margin-bottom:1rem">Pagamento enviado. Assim que o Asaas confirmar, o acesso será liberado.</div>' : ''}
      <div id="payment-error" style="display:none;background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.35);color:var(--red);padding:.8rem 1rem;border-radius:10px;margin-bottom:1rem;text-align:left"></div>
      <div class="lvl-grid" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr));text-align:left">
        <div class="pcard">
          <span class="chip on">SEMANAL</span>
          <h3 style="font-size:2rem;margin:1rem 0">R$ 21,90</h3>
          <p style="color:var(--text2);margin-bottom:1rem">Cobrança recorrente a cada 7 dias.</p>
          <div class="plan-feature">✓ Acesso a todos os 50 níveis</div><div class="plan-feature">✓ Tutor IA e correção detalhada</div><div class="plan-feature">✓ Cancele quando quiser</div>
          <div style="display:grid;gap:.55rem">
            <button class="btn btn-primary" onclick="subscribe('weekly','card')">💳 Cartão recorrente</button>
            <button class="btn btn-ghost" style="border-color:rgba(34,211,160,.45);color:var(--green)" onclick="subscribe('weekly','pix')">⚡ Pagar com PIX</button>
          </div>
        </div>
        <div class="pcard" style="border-color:var(--accent)">
          <span class="chip on">MENSAL · MELHOR VALOR</span>
          <h3 style="font-size:2rem;margin:1rem 0">R$ 75,99</h3>
          <p style="color:var(--text2);margin-bottom:1rem">Cobrança recorrente mensal.</p>
          <div class="plan-feature">✓ Economia comparada ao semanal</div><div class="plan-feature">✓ Acesso a todos os recursos</div><div class="plan-feature">✓ Liberação automática confirmada</div>
          <div style="display:grid;gap:.55rem">
            <button class="btn btn-primary" onclick="subscribe('monthly','card')">💳 Cartão recorrente</button>
            <button class="btn btn-ghost" style="border-color:rgba(34,211,160,.45);color:var(--green)" onclick="subscribe('monthly','pix')">⚡ Pagar com PIX</button>
          </div>
        </div>
      </div>
      <p style="color:var(--text3);font-size:.76rem;margin-top:1rem">No cartão, a renovação é automática. No PIX, o acesso vale pelo período escolhido e deve ser renovado manualmente ao vencer.</p>
      <button class="btn btn-ghost" style="margin-top:.8rem" onclick="refreshSubscription()">Já paguei — verificar novamente</button>
    </div>`;
}

async function subscribe(plan, method){
  const button = event?.currentTarget;
  if (button) { button.disabled = true; button.textContent = 'Abrindo pagamento…'; }
  try {
    const res = await authFetch('/api/create-checkout', {
      method: 'POST',
      headers: { 'Content-Type':'application/json' },
      body: JSON.stringify({ plan, method })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    location.href = data.url;
  } catch (err) {
    const message = err.message || 'Não foi possível abrir o pagamento.';
    const errorBox = document.getElementById('payment-error');
    if (errorBox) {
      errorBox.textContent = 'Erro no pagamento: ' + message;
      errorBox.style.display = 'block';
    }
    toast(message, 'err');
    if (button) {
      button.disabled = false;
      button.textContent = method === 'pix' ? '⚡ Pagar com PIX' : '💳 Cartão recorrente';
    }
  }
}

async function doLogout(){
  if (supabaseClient) await supabaseClient.auth.signOut();
  currentSession = null;
  subscriptionActive = false;
  document.getElementById('subscription-bubble')?.classList.remove('show');
  me = null;
  document.getElementById('app-screen').classList.remove('active');
  document.getElementById('auth-screen').classList.add('active');
}

const originalGo = go;
go = function(target){
  if (!subscriptionActive) return renderPaywall();
  return originalGo(target);
};

const originalFetchQuiz = fetchQuiz;
fetchQuiz = async function(id){
  if (!subscriptionActive) return renderPaywall();
  return originalFetchQuiz(id);
};

</script>
